name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      # Framework-dependent: users install the .NET 6 Desktop Runtime themselves.
      # On tag builds the version comes from the tag (v1.2.3 -> 1.2.3).
      - name: Publish
        shell: pwsh
        run: |
          $versionArgs = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $versionArgs += "-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))"
          }
          dotnet publish DCP-Tool/DCP-Tool.csproj -c Release -r win-x64 --self-contained false -o publish/DCP-Tool @versionArgs

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/DCP-Tool -DestinationPath publish/DCP-Tool-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCP-Tool-win-x64
          path: publish/DCP-Tool

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DCP-Tool-win-x64.zip
          body: Requires the [.NET 6 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/6.0).
          generate_release_notes: true
